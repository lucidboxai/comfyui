  nvidia-base:
    runs-on: ubuntu-latest
    # NVIDIA image modernized: Ubuntu 24.04, Python 3.12, CUDA 12.6.3,
    # PyTorch 2.12.0, ComfyUI v0.22.0.
    env:
      UBUNTU_VERSION: "24.04"
    strategy:
      fail-fast: false
      matrix:
        build:
          # ADR-007: comfyui_sha is the SHA-pinned git ref used for actual
          # `git checkout` (immutable). comfyui stays as the human-readable
          # label used for image tag suffix. Refresh BOTH together when
          # bumping ComfyUI.
          - {latest: "true", comfyui: "v0.22.0", comfyui_sha: "a8d2519058ea766ca3b14916bcc01ecef5efd235", python: "3.12", pytorch: "2.11.0", cuda: "12.6.3-cudnn-runtime"}
    steps:
      -
        name: Free Space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h
      -
        name: Env Setter
        run: |
          REPO=${GITHUB_REPOSITORY,,}
          echo "REPO_NAMESPACE=${REPO%%/*}" >> ${GITHUB_ENV}
          echo "REPO_NAME=${REPO#*/}" >> ${GITHUB_ENV}
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Permissions fixes
        run: |
          target="${HOME}/work/${{ env.REPO_NAME }}/${{ env.REPO_NAME }}/build/COPY*"
          chmod -R ug+rwX ${target}
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Set tags
        run: |
          img_path_ghcr="ghcr.io/${{ env.REPO_NAMESPACE }}/${{ env.REPO_NAME }}"
          # ADR-007: prefer the SHA-pinned comfyui_sha for actual git checkout
          # (immutable). Fall back to the human-readable comfyui ref if no SHA
          # is set, then to a latest-tag API fetch if neither is set.
          if [[ -n '${{ matrix.build.comfyui_sha }}' ]]; then
              COMFYUI_BUILD_REF="${{ matrix.build.comfyui_sha }}"
          elif [[ -n '${{ matrix.build.comfyui }}' ]]; then
              COMFYUI_BUILD_REF="${{ matrix.build.comfyui }}"
          else
              COMFYUI_BUILD_REF="$(curl -s https://api.github.com/repos/comfyanonymous/ComfyUI/tags | jq -r '.[0].name')"
          fi
          [ -z "$COMFYUI_BUILD_REF" ] && { echo "Error: COMFYUI_BUILD_REF is empty. Exiting script." >&2; exit 1; }
          echo "COMFYUI_BUILD_REF=${COMFYUI_BUILD_REF}" >> ${GITHUB_ENV}

          base_tag="v2-cuda-${{ matrix.build.cuda }}-${{ env.UBUNTU_VERSION }}"

          # Use the human-readable comfyui label for image tag suffix (not the
          # SHA). Falls back to COMFYUI_BUILD_REF for matrix entries that don't
          # set a separate label — preserves existing tag schema for cpu/amd.
          comfyui_label="${{ matrix.build.comfyui }}"
          [ -z "$comfyui_label" ] && comfyui_label="$COMFYUI_BUILD_REF"

          if [[ ${{ matrix.build.latest }} == "true" ]]; then
              echo "Marking latest"
              TAGS="${img_path_ghcr}:${base_tag}-${comfyui_label}, ${img_path_ghcr}:${base_tag}, ${img_path_ghcr}:latest, ${img_path_ghcr}:latest-cuda"
          else
              TAGS="${img_path_ghcr}:${base_tag}-${comfyui_label}"
          fi
          echo "TAGS=${TAGS}" >> ${GITHUB_ENV}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build
          build-args: |
            IMAGE_BASE=ghcr.io/lucidboxai/python:${{ matrix.build.python }}-v2-cuda-${{ matrix.build.cuda }}-${{ env.UBUNTU_VERSION }}
            PYTHON_VERSION=${{ matrix.build.python }}
            PYTORCH_VERSION=${{ matrix.build.pytorch }}
            COMFYUI_BUILD_REF=${{ env.COMFYUI_BUILD_REF }}
          push: true
          provenance: false
          tags: ${{ env.TAGS }}

